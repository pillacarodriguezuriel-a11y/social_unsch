name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'codex/**'
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verificación Estática, Tipos, Cobertura y Compilación
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.14.0', '24.11.1']
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Instalación limpia de dependencias
        run: npm ci

      - name: Ejecutar verificación integral (Límites, Tipos, Cobertura >= 90%, Tests y Builds)
        run: npm run verify

  test-real:
    name: Pruebas Reales con Servicios Desechables (PostgreSQL y Redis)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.14.0', '24.11.1']
    needs: verify
    # Sin `services`: el arnés (apps/api/tests/real/helpers/test-environment.ts) crea sus propios
    # contenedores en 127.0.0.1:55432 y 56379. Declarar servicios en esos puertos provocaba el
    # conflicto que hacía fallar este job desde la etapa 4.
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Instalación limpia de dependencias
        run: npm ci

      - name: Compilar contratos de intercambio
        run: npm run build:contracts

      - name: Ejecutar pruebas reales contra contenedores desechables
        run: npm run test:real

      - name: Eliminar contenedores de prueba
        if: always()
        run: docker rm -f social_unsch_test_pg_etapa2 social_unsch_test_redis_etapa2 || true

  e2e-radar:
    name: E2E de Radar (API y Radar compilados, PostgreSQL y Redis reales)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.14.0', '24.11.1']
    needs: verify
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Instalación limpia de dependencias
        run: npm ci

      - name: Ejecutar pruebas de extremo a extremo y aislamiento de fallos
        shell: bash
        run: |
          set -o pipefail
          # Las pruebas fallidas se publican como anotaciones para poder leerlas sin descargar el log.
          npm run test:e2e 2>&1 | tee e2e.log || {
            # GitHub admite 10 anotaciones de error por paso: primero los mensajes de error, después las pruebas fallidas.
            { grep -aE "Tiempo agotado|falló|SEGURIDAD|Error|expected|actual" e2e.log | grep -av "✖" | head -7
              grep -a "^✖" e2e.log | head -3; } | sed 's/^/::error title=E2E Radar::/'
            exit 1
          }

      - name: Eliminar contenedores de prueba
        if: always()
        run: docker rm -f social_unsch_e2e_pg social_unsch_e2e_redis || true
